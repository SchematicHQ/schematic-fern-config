  <text x="1050.0" y="163" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">Replicator mode</text>
  <rect x="990" y="183" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="1050.0" y="197.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#0C4A6E">Track events</text>
  <text x="1050.0" y="212.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">batched, retried</text>
  <rect x="990" y="518" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
