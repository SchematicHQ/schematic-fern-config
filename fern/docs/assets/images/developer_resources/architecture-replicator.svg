  <text x="1090.0" y="104" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1F2937">Your backend (your network)</text>
  <polyline points="90.0,300 90.0,44 1220.0,44 1220.0,300" fill="none" stroke="#9090B8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
  <text x="660.0" y="34" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">your app's own requests to your backend (Schematic is not in this path)</text>
