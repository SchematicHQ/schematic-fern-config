  <text x="1050.0" y="563.0" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">companies from Redis</text>
  <rect x="990" y="343" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="1050.0" y="357.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#0C4A6E">API calls</text>
  <text x="1050.0" y="372.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">companies, users, plans</text>
