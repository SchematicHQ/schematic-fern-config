  <text x="600.0" y="372.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#7C3AED">plans, usage,</text>
  <text x="600.0" y="387.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#7C3AED">credit balances</text>
