      <polygon points="0 0, 8 3, 0 6" fill="#9090B8"/>
    </marker>
    <marker id="arrs" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#9090B8"/>
    </marker>
  </defs>
  <rect width="1320" height="750" fill="#FFFFFF"/>
  <rect x="20" y="80" width="340" height="620" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
