  <text x="1220.0" y="652.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#7C3AED">container you run</text>
  <polyline points="1220.0,617 1220.0,578" fill="none" stroke="#9090B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1228.0" y="597.5" text-anchor="start" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">writes</text>
  <polyline points="1155,645 800,645" fill="none" stroke="#9090B8" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arr)"/>
  <text x="890.0" y="634" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">WebSocket</text>
  <text x="890.0" y="657" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">every flag + company change</text>
  <line x1="20" y1="725" x2="50" y2="725" stroke="#9090B8" stroke-width="1.5"/>
  <text x="58" y="725" text-anchor="start" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">primary path</text>
