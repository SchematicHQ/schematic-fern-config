  <text x="198" y="725" text-anchor="start" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">optional or fallback</text>
  <rect x="340" y="718" width="22" height="14" rx="3" fill="#EDE9FE" stroke="#9563FF" stroke-width="1.5"/>
  <text x="370" y="725" text-anchor="start" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">provided by Schematic</text>
  <rect x="520" y="718" width="22" height="14" rx="3" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="550" y="725" text-anchor="start" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">your code and the SDK you install</text>
