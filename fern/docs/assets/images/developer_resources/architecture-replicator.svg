  <text x="890.0" y="377" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">identify, updates</text>
  <polyline points="990,548 800,548" fill="none" stroke="#9090B8" stroke-width="1.5" marker-start="url(#arrs)" marker-end="url(#arr)" stroke-dasharray="5,4"/>
  <text x="890.0" y="537" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">REST</text>
  <text x="890.0" y="560" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">fallback only</text>
