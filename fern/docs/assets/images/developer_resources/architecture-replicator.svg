  <text x="1220.0" y="548.0" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#6B7280">flags, companies,</text>
  <text x="1220.0" y="563.0" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#6B7280">users</text>
  <polyline points="1110,548 1155,548" fill="none" stroke="#9090B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1137.5" y="538" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="400" fill="#6B7280">reads</text>
  <rect x="1155" y="617" width="130" height="56" rx="8" fill="#EDE9FE" stroke="#9563FF" stroke-width="1.5"/>
