  <text x="257.5" y="525.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#0C4A6E">Flag and entitlement</text>
  <text x="257.5" y="540.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#0C4A6E">checks</text>
  <text x="257.5" y="555.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">values in memory +</text>
  <text x="257.5" y="570.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">localStorage</text>
  <polyline points="150,340 175,340" fill="none" stroke="#9090B8" stroke-width="1.5" marker-end="url(#arr)"/>
