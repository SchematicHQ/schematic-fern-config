  <text x="257.5" y="163" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">JS · React · Vue · Angular</text>
  <rect x="185" y="183" width="145" height="44" rx="8" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="257.5" y="197.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#0C4A6E">Track events</text>
  <text x="257.5" y="212.5" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="400" fill="#0369A1">queued, retried</text>
