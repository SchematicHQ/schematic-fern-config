# Curates the temporary-access-token spec for the docs. The API repo's
# generator emits no descriptions and no x-fern extensions, so the audience
# tags, the prose and the corrected shapes live here and survive every
# `fern api update`. `public` is what docs.yml shows; `internal` hides the
# legacy embed routes the components no longer call.
info:
  title: Components API
  description: >-
    The browser-facing billing API behind the drop-in components and the
    schematic-react hooks. A temporary access token scopes every call to one
    company.
components:
  securitySchemes:
    ApiKeyAuth:
      description: >-
        A temporary access token in the `X-Schematic-Api-Key` header. Your
        server mints it with `POST /temporary-access-tokens` on the secret-key
        API for a company, optionally for one of its users, and hands it to
        the page. The token fixes the company every request reads and writes.
  schemas:
    ApiError:
      properties:
        problems:
          type: array
          description: >-
            On a checkout write or finalize the purchase rules refuse: what the
            server found wrong, the same list the checkout's `problems` field
            holds. Each has a `code`, whether it is `blocking`, a `message` safe
            to show the customer, and the ids of what it is about.
          items:
            $ref: '#/components/schemas/CheckoutProblemResponseData'
    CreateCheckoutRequest:
      required: []
      properties:
        company_id:
          x-fern-audiences:
            - internal
    UpdateCheckoutRequest:
      required:
        - version
paths:
  /catalog/view:
    get:
      summary: Get the catalog view
      description: >-
        The environment's catalog as the company sees it: plans, add-ons and
        credit bundles, each with the company's standing against it
        (`current`, `valid`, `invalid_reason`, `company_can_trial`), the
        checkout settings, and `capabilities.checkout`. Needs the
        `multi-product-catalog` flag on the account.
      x-fern-audiences:
        - public
  /catalogs/{catalog_id}/view:
    get:
      summary: Get a catalog view by ID
      description: >-
        The same view for the catalog `catalog_id` names rather than the
        environment's default catalog.
      x-fern-audiences:
        - public
  /checkouts:
    get:
      summary: List checkouts
      description: >-
        The checkouts this session opened for the token's company. Filter by
        `statuses`.
      parameters:
        - name: statuses
          in: query
          description: Only checkouts in these statuses, up to five.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckoutStatus'
            maxItems: 5
        - name: limit
          in: query
          description: Page limit (default 100)
          schema:
            type: integer
            format: int64
            example: "100"
            maximum: 250
            minimum: 0
        - name: offset
          in: query
          description: Page offset (default 0)
          schema:
            type: integer
            format: int64
            example: "0"
      x-fern-audiences:
        - public
    post:
      summary: Create a checkout
      description: >-
        Opens a checkout for the token's company and prices the cart when it
        is priceable. A cart the purchase rules reject is still created, open,
        with the one problem that says why; a refusal creates nothing. The
        response carries the `version` every later write must send, and
        `expires_at` says when an open checkout closes on its own.
      x-fern-audiences:
        - public
  /checkouts/{checkout_id}:
    get:
      summary: Get a checkout
      description: >-
        Reads a checkout this session opened. Resume from here before writing:
        the `version` it returns is the one the next update must send. A
        checkout another session built, or one for another company, reads as
        not found.
      x-fern-audiences:
        - public
    put:
      summary: Update a checkout
      description: >-
        Replaces the cart and prices it again. Send the `version` last read; a
        stale one answers 409 and changes nothing, so read the checkout and
        send the write again at its version. A cart the purchase rules reject
        is saved with its price cleared and one problem saying why, and the
        version still advances. The `X-Checkout-Session-ID` response header
        names the session this price belongs to; send it back on the finalize
        that follows.
      x-fern-audiences:
        - public
  /checkouts/{checkout_id}/finalize:
    post:
      summary: Finalize a checkout
      description: >-
        Charges the cart at `version` and applies it to the subscription. The
        version is claimed before the billing provider is called, so of two
        concurrent finalizes only one charges. The cart is priced once more
        first: a blocking problem refuses the purchase with 400 and the fresh
        `problems` list, and a checkout priced before a sibling completed is
        refused with 409. The claim is not released when the charge fails, so
        read the checkout before trying again. When the charge needs the
        customer, as with 3-D Secure, the response carries
        `confirm_payment_intent_client_secret` to confirm with Stripe.
      x-fern-audiences:
        - public
  /checkout/tax-id:
    get:
      summary: List tax IDs
      description: The company's tax IDs on file with the billing provider.
      x-fern-audiences:
        - public
    post:
      summary: Set the tax ID
      description: >-
        Saves a tax ID on the company's billing customer and answers with every
        tax ID now on file. The tax ID is not part of a checkout's cart; save
        it before the finalize that needs it.
      x-fern-audiences:
        - public
  /company:
    get:
      summary: Get the company
      description: >-
        The token's company: its plan and add-ons, the subscription's period
        and currency, and the payment method on file. Needs the
        `company-context-api` flag on the account; without it every `/company`
        read answers 404.
      x-fern-audiences:
        - public
  /company/usage:
    get:
      summary: List feature usage
      description: The company's entitlements and usage against each metered feature.
      x-fern-audiences:
        - public
  /company/usage/{feature_id}/users:
    get:
      summary: List feature usage by user
      description: Who in the company used the feature, and how much each.
      x-fern-audiences:
        - public
  /company/credits:
    get:
      summary: List credit balances
      description: The company's credit balances, with what each grant holds and what is purchasable.
      x-fern-audiences:
        - public
  /company/credits/{credit_id}/users:
    get:
      summary: List credit usage by user
      description: Who in the company consumed the credit, and how much each.
      x-fern-audiences:
        - public
  /company/invoices:
    get:
      summary: List invoices
      description: The company's invoices, newest first. An empty list is a company with none.
      x-fern-audiences:
        - public
  /company/upcoming-invoice:
    get:
      summary: Get the upcoming invoice
      description: >-
        A live preview of the company's next invoice from the billing provider.
        A company with nothing to bill answers 204.
      x-fern-audiences:
        - public
  /company/payment-methods:
    get:
      summary: List payment methods
      description: >-
        The company's payment methods on file, with the default marked and
        whether each can be removed.
      x-fern-audiences:
        - public
  /components/setup-intent:
    post:
      summary: Create a setup intent
      description: >-
        A Stripe SetupIntent for collecting a new payment method with Stripe's
        Payment Element. Confirm it with `stripe.confirmSetup`; the method it
        saves joins the company's methods on file.
      x-fern-audiences:
        - public
  /checkout/unsubscribe:
    delete:
      summary: Cancel the subscription
      description: Cancels the company's subscription at the end of the current period.
      x-fern-audiences:
        - public
  /checkout:
    post:
      x-fern-audiences:
        - internal
  /checkout/balance:
    get:
      x-fern-audiences:
        - internal
  /checkout/custom-field-values:
    post:
      x-fern-audiences:
        - internal
  /checkout/paymentmethod/{checkout_id}:
    delete:
      x-fern-audiences:
        - internal
  /checkout/paymentmethod/update:
    post:
      x-fern-audiences:
        - internal
  /checkout/preview:
    post:
      x-fern-audiences:
        - internal
  /components/{component_id}/hydrate:
    get:
      x-fern-audiences:
        - internal
  /components/{component_id}/hydrate/upcoming-invoice:
    get:
      x-fern-audiences:
        - internal
  /components/{component_id}/setup-intent:
    get:
      x-fern-audiences:
        - internal
  /components/hydrate:
    get:
      x-fern-audiences:
        - internal
  /components/invoices:
    get:
      x-fern-audiences:
        - internal
  /components/usage-by-user/credits/{billing_credit_id}:
    get:
      x-fern-audiences:
        - internal
  /components/usage-by-user/features/{feature_id}:
    get:
      x-fern-audiences:
        - internal
