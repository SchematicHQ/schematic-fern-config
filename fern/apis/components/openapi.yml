                    allOf:
                        - $ref: '#/components/schemas/EntitlementPriceBehavior'
                    nullable: true
                quarterly_usage_based_price:
                    $ref: '#/components/schemas/BillingPriceView'
                usage_quantity:
                    type: integer
                    description: 'The committed unit quantity for this entitlement. For custom plans this is the minimum the company is contractually committed to: the company can buy more, and finalizing a new plan version sets the subscription quantity to the larger of this value and what the subscription already holds. For standard plans it is the quantity pre-filled when subscribing. Only applies to pay-in-advance entitlements.'
                    format: int64
                    nullable: true
                value_bool:
                    type: boolean
                    nullable: true
                value_numeric:
                    type: integer
                    format: int64
                    nullable: true
                value_type:
                    $ref: '#/components/schemas/EntitlementValueType'
                yearly_usage_based_price:
                    $ref: '#/components/schemas/BillingPriceView'
            required:
                - feature_id
                - value_type
            title: UsageBasedEntitlementResponseData
        UserCreditUsageResponseData:
            type: object
            properties:
                billing_credit_id:
                    type: string
                credit_name:
                    type: string
                    description: The display name of the credit type
                credits_used:
                    type: number
                    description: The user's net track-driven consumption of the credit within the window (draws minus refunds)
                    format: double
                share:
                    type: number
                    description: This row's fraction (0-1) of the company's total track-driven consumption of the credit within the window, including unattributed consumption
                    format: double
                user:
                    allOf:
                        - $ref: '#/components/schemas/UserResponseData'
                    description: The user the consumption is attributed to; null for consumption from events sent without a user
                user_id:
                    type: string
                    description: The user the consumption is attributed to; null for unattributed consumption
                    nullable: true
            required:
                - billing_credit_id
                - credit_name
                - credits_used
                - share
            title: UserCreditUsageResponseData
        UserFeatureUsageResponseData:
            type: object
            properties:
                feature:
                    $ref: '#/components/schemas/FeatureResponseData'
                last_seen:
                    type: string
                    description: When the user last used the feature within the window
                    format: date-time
                share:
                    type: number
