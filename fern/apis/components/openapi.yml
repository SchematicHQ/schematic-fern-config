                    format: double
                user:
                    allOf:
                        - $ref: '#/components/schemas/UserResponseData'
                    description: The user the usage is attributed to; null for usage from events sent without a user
                user_id:
                    type: string
                    description: The user the usage is attributed to; null for unattributed usage
                    nullable: true
                value:
                    type: integer
                    description: The user's usage of the feature within the window
                    format: int64
            required:
                - last_seen
                - share
                - value
            title: UserFeatureUsageResponseData
        UserResponseData:
            type: object
            properties:
                created_at:
                    type: string
                    format: date-time
                environment_id:
                    type: string
                id:
                    type: string
                last_seen_at:
                    type: string
                    format: date-time
                    nullable: true
                name:
                    type: string
                updated_at:
                    type: string
                    format: date-time
            required:
                - id
                - environment_id
                - name
                - created_at
                - updated_at
            title: UserResponseData
