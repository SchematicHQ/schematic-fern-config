        UsageBasedEntitlementResponseData:
            type: object
            properties:
                billing_threshold:
                    type: integer
                    format: int64
                    nullable: true
                consumption_rate:
                    type: number
                    format: double
                    nullable: true
                feature_id:
                    type: string
                metered_price:
                    $ref: '#/components/schemas/BillingPriceView'
                metric_period:
                    allOf:
                        - $ref: '#/components/schemas/MetricPeriod'
                    nullable: true
                metric_period_month_reset:
                    allOf:
                        - $ref: '#/components/schemas/MetricPeriodMonthReset'
                    nullable: true
                monthly_usage_based_price:
                    $ref: '#/components/schemas/BillingPriceView'
