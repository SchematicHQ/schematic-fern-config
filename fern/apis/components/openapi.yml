info:
    title: Schematic API
    version: "0.1"
    description: Schematic API
openapi: 3.0.0
security:
    - ApiKeyAuth: []
servers:
    - url: https://api.schematichq.com
components:
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            in: header
            name: X-Schematic-Api-Key
    responses:
        BadRequest:
            description: Bad request
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        Conflict:
            description: Conflict
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        Forbidden:
            description: Forbidden
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        NotFound:
            description: Not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        PaymentRequired:
            description: Payment required
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        ServerError:
            description: Server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        Unauthorized:
            description: Unauthorized
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
        UnprocessableEntity:
            description: Unprocessable entity
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ApiError'
    schemas:
        ApiError:
            type: object
            properties:
                error:
                    type: string
                    description: Error message
            required:
                - error
        BillingArrearsAnchor:
            type: string
            enum:
                - billing_period_start
                - month_end
        BillingArrearsCadence:
            type: string
            enum:
                - end_of_billing_period
                - monthly
                - quarterly
        BillingCollectionMethod:
            type: string
            enum:
                - charge_automatically
                - send_invoice
        BillingCreditAutoTopupAvailability:
            type: string
            enum:
                - "off"
                - automatic
                - user_controlled
        BillingCreditBundleStatus:
            type: string
            enum:
                - active
                - inactive
        BillingCreditBundleType:
            type: string
            enum:
                - fixed
        BillingCreditBundleView:
            type: object
            properties:
                bundle_type:
                    $ref: '#/components/schemas/BillingCreditBundleType'
                compatible_plan_ids:
                    type: array
                    items:
                        type: string
                    maxItems: 100
                created_at:
                    type: string
                    format: date-time
                credit_description:
                    type: string
                credit_icon:
                    type: string
                    nullable: true
                credit_id:
                    type: string
                credit_name:
                    type: string
                currency_prices:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreditBundleCurrencyPrice'
                    maxItems: 256
                expiry_type:
                    $ref: '#/components/schemas/BillingCreditExpiryType'
                expiry_unit:
                    $ref: '#/components/schemas/BillingCreditExpiryUnit'
                expiry_unit_count:
                    type: integer
                    format: int64
                    nullable: true
                has_grants:
                    type: boolean
                id:
                    type: string
                name:
                    type: string
                plural_name:
                    type: string
                    nullable: true
                price:
                    $ref: '#/components/schemas/BillingProductPriceResponseData'
                quantity:
                    type: integer
                    format: int64
                    nullable: true
                singular_name:
                    type: string
                    nullable: true
                status:
                    $ref: '#/components/schemas/BillingCreditBundleStatus'
                unit_price:
                    $ref: '#/components/schemas/BillingProductPriceResponseData'
                updated_at:
                    type: string
                    format: date-time
            required:
                - id
                - credit_id
                - name
                - status
                - bundle_type
                - expiry_unit
                - expiry_type
                - credit_name
                - currency_prices
                - has_grants
                - compatible_plan_ids
                - created_at
                - updated_at
            title: BillingCreditBundleView
        BillingCreditBurnStrategy:
            type: string
            enum:
                - expiration_priority
                - first_in_first_out
                - last_in_first_out
                - plan_first_then_credit_bundles_first_in_first_out
        BillingCreditExpiryType:
            type: string
            enum:
                - duration
                - end_of_billing_period
                - end_of_next_billing_period
                - end_of_trial
                - no_expiry
        BillingCreditExpiryUnit:
            type: string
            enum:
                - billing_periods
                - days
        BillingCreditGrantReason:
            type: string
            enum:
                - adjustment
                - billing_credit_auto_topup
                - free
                - plan
                - postpaid_forgiven
                - postpaid_overdraft
                - postpaid_settlement
                - purchased
                - rollover
        BillingCreditGrantZeroedOutReason:
            type: string
            enum:
                - customer_archived
                - expired
                - integration_uninstalled
                - license_retired
                - manual
                - plan_change
                - plan_period_reset
                - reconciled
        BillingCreditLedgerAuthority:
            type: string
            enum:
                - schematic_authoritative
                - external_mirror
                - external_rated
        BillingCreditResponseData:
            type: object
            properties:
                burn_strategy:
                    $ref: '#/components/schemas/BillingCreditBurnStrategy'
                cost_editable:
                    type: boolean
                created_at:
                    type: string
                    format: date-time
                currency_prices:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreditCurrencyPriceResponseData'
                    maxItems: 256
                default_expiry_unit:
                    $ref: '#/components/schemas/BillingCreditExpiryUnit'
                default_expiry_unit_count:
                    type: integer
                    format: int64
                    nullable: true
                default_rollover_policy:
                    $ref: '#/components/schemas/BillingCreditRolloverPolicy'
                description:
                    type: string
                icon:
                    type: string
                    nullable: true
                id:
                    type: string
                ledger_authority:
                    $ref: '#/components/schemas/BillingCreditLedgerAuthority'
                name:
                    type: string
                plural_name:
                    type: string
                    nullable: true
                price:
                    $ref: '#/components/schemas/BillingPriceResponseData'
                product:
                    $ref: '#/components/schemas/BillingProductResponseData'
                singular_name:
                    type: string
                    nullable: true
                updated_at:
                    type: string
                    format: date-time
            required:
                - id
                - name
                - description
                - default_expiry_unit
                - default_rollover_policy
                - burn_strategy
                - ledger_authority
                - cost_editable
                - currency_prices
                - created_at
                - updated_at
            title: BillingCreditResponseData
        BillingCreditRolloverPolicy:
            type: string
            enum:
                - expire
                - none
                - rollover
        BillingCreditView:
            type: object
            properties:
                account_id:
                    type: string
                burn_strategy:
                    $ref: '#/components/schemas/BillingCreditBurnStrategy'
                cost_editable:
                    type: boolean
                created_at:
                    type: string
                    format: date-time
                currency_prices:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreditCurrencyPrice'
                    maxItems: 1000
                default_expiry_unit:
                    $ref: '#/components/schemas/BillingCreditExpiryUnit'
                default_expiry_unit_count:
                    type: integer
                    format: int64
                    nullable: true
                default_rollover_policy:
                    $ref: '#/components/schemas/BillingCreditRolloverPolicy'
                description:
                    type: string
                environment_id:
                    type: string
                icon:
                    type: string
                    nullable: true
                id:
                    type: string
                ledger_authority:
                    $ref: '#/components/schemas/BillingCreditLedgerAuthority'
                name:
                    type: string
                plural_name:
                    type: string
                    nullable: true
                price:
                    $ref: '#/components/schemas/BillingPriceView'
                price_per_unit:
                    type: integer
                    format: int64
                    nullable: true
                price_per_unit_decimal:
                    type: string
                    nullable: true
                product:
                    $ref: '#/components/schemas/BillingProductRecordResponseData'
                singular_name:
                    type: string
                    nullable: true
                updated_at:
                    type: string
                    format: date-time
            required:
                - id
                - account_id
                - environment_id
                - name
                - description
                - default_expiry_unit
                - default_rollover_policy
                - burn_strategy
                - ledger_authority
                - cost_editable
                - currency_prices
                - created_at
                - updated_at
            title: BillingCreditView
        BillingLinkedResourceResponseData:
            type: object
            properties:
                billing_provider:
                    $ref: '#/components/schemas/BillingProviderType'
                external_resource_id:
                    type: string
                originator:
                    $ref: '#/components/schemas/BillingProviderType'
            required:
                - billing_provider
                - external_resource_id
                - originator
            title: BillingLinkedResourceResponseData
        BillingPlanCreditGrantBillingMode:
            type: string
            enum:
                - granted
                - billed
        BillingPlanCreditGrantPriceTierResponseData:
            type: object
            properties:
                from:
                    type: integer
                    description: Lower bound of the tier, in credits per invoice (inclusive).
                    format: int64
                per_unit_price:
                    type: integer
                    description: Price per credit in this tier, in the plan currency's smallest unit.
                    format: int64
                    nullable: true
                per_unit_price_decimal:
                    type: string
                    description: Price per credit in this tier as a decimal, for rates below one cent.
                    nullable: true
                to:
                    type: integer
                    description: Upper bound of the tier, in credits per invoice (inclusive). Null marks the final, unbounded tier.
                    format: int64
                    nullable: true
            required:
                - from
            title: BillingPlanCreditGrantPriceTierResponseData
        BillingPlanCreditGrantResetCadence:
            type: string
            enum:
                - daily
                - every_6_months
                - monthly
                - quarterly
                - weekly
                - yearly
        BillingPlanCreditGrantResetStart:
            type: string
            enum:
                - billing_period
                - first_of_month
        BillingPlanCreditGrantResetType:
            type: string
            enum:
                - no_reset
                - plan_period
        BillingPlanCreditGrantResponseData:
            type: object
            properties:
                arrears_anchor:
                    allOf:
                        - $ref: '#/components/schemas/BillingArrearsAnchor'
                    description: Which boundary closes a monthly arrears window. Only meaningful when arrears_cadence is monthly.
                    nullable: true
                arrears_cadence:
                    allOf:
                        - $ref: '#/components/schemas/BillingArrearsCadence'
                    description: How often postpaid charges are closed and invoiced. Defaults to end_of_billing_period.
                    nullable: true
                auto_topup_amount:
                    type: integer
                    format: int64
                    nullable: true
                auto_topup_amount_type:
                    type: string
                    nullable: true
                auto_topup_availability:
                    $ref: '#/components/schemas/BillingCreditAutoTopupAvailability'
                auto_topup_enabled:
                    type: boolean
                    description: Derived from auto_topup_availability; use that instead.
                    deprecated: true
                auto_topup_expiry_type:
                    allOf:
                        - $ref: '#/components/schemas/BillingCreditExpiryType'
                    nullable: true
                auto_topup_expiry_unit:
                    allOf:
                        - $ref: '#/components/schemas/BillingCreditExpiryUnit'
                    nullable: true
                auto_topup_expiry_unit_count:
                    type: integer
                    format: int64
                    nullable: true
                auto_topup_self_service:
                    type: boolean
                    description: Derived from auto_topup_availability; use that instead.
                    deprecated: true
                auto_topup_threshold_credits:
                    type: integer
                    format: int64
                    nullable: true
                auto_topup_threshold_percent:
                    type: integer
                    format: int64
                    nullable: true
                billing_mode:
                    allOf:
                        - $ref: '#/components/schemas/BillingPlanCreditGrantBillingMode'
                    description: Whether the credits are included in the plan price (granted) or billed as their own subscription line at a price per credit (billed).
                can_buy_bundles:
                    type: boolean
                    description: 'Deprecated: bundle availability is a per-bundle plan compatibility set now; use compatible_plan_ids on credit bundles instead.'
                    deprecated: true
                company_credit_amount:
                    type: integer
                    description: Credits granted once per company on top of the per-license amount. Always 0 when scaling is fixed.
                    format: int64
                created_at:
                    type: string
                    format: date-time
                credit:
                    $ref: '#/components/schemas/BillingCreditResponseData'
                credit_amount:
                    type: integer
                    format: int64
                credit_id:
                    type: string
                credit_name:
                    type: string
                    description: Use credit.name from the nested credit object instead
                    deprecated: true
                credit_plural_name:
                    type: string
                    description: Use plural_name from the nested credit object instead
                    nullable: true
                    deprecated: true
                credit_singular_name:
                    type: string
                    description: Use singular_name from the nested credit object instead
                    nullable: true
                    deprecated: true
                expiry_type:
                    allOf:
                        - $ref: '#/components/schemas/BillingCreditExpiryType'
                    nullable: true
                expiry_unit:
                    allOf:
                        - $ref: '#/components/schemas/BillingCreditExpiryUnit'
                    nullable: true
                expiry_unit_count:
                    type: integer
                    format: int64
                    nullable: true
                id:
                    type: string
                license_id:
                    type: string
                    description: The license whose quantity scales this grant. Set only when scaling is per_license.
                    nullable: true
                overdraft_limit:
                    type: number
                    description: 'Optional limit on how far the balance may go below zero, in credits. A floor on the balance, not an allowance per invoice window: consumption is denied once the balance would fall below minus this figure, and stays denied until a new grant lands or the negative balance is settled. Absent means no limit.'
                    format: double
                    nullable: true
                plan:
                    $ref: '#/components/schemas/PreviewObjectResponseData'
                plan_id:
                    type: string
                plan_name:
                    type: string
                    description: Use plan.name from the nested plan object instead
                    deprecated: true
                plan_version_id:
                    type: string
                    nullable: true
                postpaid_enabled:
                    type: boolean
                    description: Whether consumption may continue past a zero balance, accruing at postpaid_rate_per_unit rather than being denied.
                postpaid_rate_per_unit:
                    type: integer
                    description: Amount charged per credit consumed past zero, in the currency's minor unit. Defaults to the credit's own cost basis when postpaid is enabled without one.
                    format: int64
                    nullable: true
                postpaid_rate_per_unit_decimal:
                    type: string
                    description: Decimal form of postpaid_rate_per_unit, for rates finer than one minor unit.
                    nullable: true
                price:
                    allOf:
                        - $ref: '#/components/schemas/BillingPriceResponseData'
                    description: The Stripe price a billed grant bills through. Minted when the plan version is published.
                price_tiers:
                    type: array
                    description: Tier table pricing the credits, cheapest bound first. Empty unless billing_mode is billed and the credits are priced on tiers.
                    items:
                        $ref: '#/components/schemas/BillingPlanCreditGrantPriceTierResponseData'
                    maxItems: 1000
                reset_cadence:
                    allOf:
                        - $ref: '#/components/schemas/BillingPlanCreditGrantResetCadence'
                    nullable: true
                reset_start:
                    allOf:
                        - $ref: '#/components/schemas/BillingPlanCreditGrantResetStart'
                    nullable: true
                reset_type:
                    allOf:
                        - $ref: '#/components/schemas/BillingPlanCreditGrantResetType'
                    nullable: true
                rollover_percentage:
                    type: integer
                    description: Percentage of unused credits that carry over when this grant resets. Only meaningful when reset_type is plan_period.
                    format: int64
                scaling:
                    allOf:
                        - $ref: '#/components/schemas/PlanCreditGrantScaling'
                    description: Whether the grant is a fixed amount per company, or issued once per license the company holds.
                tier_mode:
                    allOf:
                        - $ref: '#/components/schemas/BillingTiersMode'
                    description: 'How price_tiers apply: volume prices every credit at the rate of the tier the total lands in, graduated prices each tier''s own credits at its own rate. Set only when price_tiers is non-empty.'
                    nullable: true
                unit_price:
                    type: integer
                    description: Price per credit in the plan currency's smallest unit. Set only when billing_mode is billed and the credits are priced at one rate.
                    format: int64
                    nullable: true
                unit_price_decimal:
                    type: string
                    description: Price per credit as a decimal in the plan currency's smallest unit. Set only when billing_mode is billed and the rate is below one cent.
                    nullable: true
                updated_at:
                    type: string
                    format: date-time
                warning_tiers:
                    type: array
                    description: Usage-warning thresholds, in credits remaining in the company's balance, highest first. Schematic sends a credit.usage_warning_reached webhook when the balance drops to each one. Empty when none are set.
                    items:
                        $ref: '#/components/schemas/BillingPlanCreditGrantWarningTierResponseData'
                    maxItems: 1000
            required:
                - id
                - credit_id
                - plan_id
                - plan_name
                - credit_amount
                - credit_name
                - company_credit_amount
                - scaling
                - auto_topup_availability
                - can_buy_bundles
                - auto_topup_enabled
                - auto_topup_self_service
                - rollover_percentage
                - postpaid_enabled
                - billing_mode
                - price_tiers
                - warning_tiers
                - created_at
                - updated_at
            title: BillingPlanCreditGrantResponseData
        BillingPlanCreditGrantWarningTierResponseData:
            type: object
            properties:
                id:
                    type: string
                key:
                    type: string
                value:
                    type: integer
                    description: Credits remaining in the company's balance at which this warning is reached.
                    format: int64
            required:
                - id
                - key
                - value
            title: BillingPlanCreditGrantWarningTierResponseData
        BillingPriceResponseData:
            type: object
            properties:
                currency:
                    $ref: '#/components/schemas/Currency'
                external_price_id:
                    type: string
                id:
                    type: string
                interval:
                    $ref: '#/components/schemas/BillingProductPriceInterval'
                interval_count:
                    type: integer
                    format: int64
                nickname:
                    type: string
                    nullable: true
                price:
                    type: integer
                    format: int64
                price_decimal:
                    type: string
                    nullable: true
                provider_type:
                    $ref: '#/components/schemas/BillingProviderType'
                scheme:
                    $ref: '#/components/schemas/BillingPriceScheme'
            required:
                - currency
                - external_price_id
                - id
                - interval
                - interval_count
                - price
                - provider_type
                - scheme
            title: BillingPriceResponseData
        BillingPriceScheme:
            type: string
            enum:
                - per_unit
                - tiered
        BillingPriceUsageType:
            type: string
            enum:
                - licensed
                - metered
        BillingPriceView:
            type: object
            properties:
                billing_scheme:
                    $ref: '#/components/schemas/BillingPriceScheme'
                created_at:
                    type: string
                    format: date-time
                currency:
                    $ref: '#/components/schemas/Currency'
                id:
                    type: string
                interval:
                    $ref: '#/components/schemas/BillingProductPriceInterval'
                interval_count:
                    type: integer
                    format: int64
                is_active:
                    type: boolean
                meter_event_name:
                    type: string
                    nullable: true
                meter_event_payload_key:
                    type: string
                    nullable: true
                meter_id:
                    type: string
                    nullable: true
                nickname:
                    type: string
                    nullable: true
                package_size:
                    type: integer
                    format: int64
                price:
                    type: integer
                    format: int64
                price_decimal:
                    type: string
                    nullable: true
                price_external_id:
                    type: string
                price_id:
                    type: string
                price_tier:
                    type: array
                    items:
                        $ref: '#/components/schemas/BillingProductPriceTierResponseData'
                    maxItems: 100
                product_external_id:
                    type: string
                product_id:
                    type: string
                product_name:
                    type: string
                provider_type:
                    $ref: '#/components/schemas/BillingProviderType'
                tiers_mode:
                    allOf:
                        - $ref: '#/components/schemas/BillingTiersMode'
                    nullable: true
                updated_at:
                    type: string
                    format: date-time
                usage_type:
                    $ref: '#/components/schemas/BillingPriceUsageType'
            required:
                - id
                - billing_scheme
                - created_at
                - currency
                - interval
                - interval_count
                - is_active
                - package_size
                - price
                - price_external_id
                - product_external_id
                - provider_type
                - updated_at
                - usage_type
                - price_id
                - product_id
                - product_name
                - price_tier
            title: BillingPriceView
        BillingProductDetailResponseData:
            type: object
            properties:
                account_id:
                    type: string
                created_at:
                    type: string
                    format: date-time
                currency:
                    type: string
                    description: Deprecated; currencies are associated with prices, not products
                    nullable: true
                    deprecated: true
                environment_id:
                    type: string
                external_id:
                    type: string
                is_active:
                    type: boolean
                name:
                    type: string
                price:
                    type: number
                    format: double
                price_decimal:
                    type: string
                    nullable: true
                prices:
                    type: array
                    items:
                        $ref: '#/components/schemas/BillingPriceResponseData'
                    maxItems: 1000
                product_id:
                    type: string
                provider_type:
                    $ref: '#/components/schemas/BillingProviderType'
                quantity:
                    type: number
                    format: double
                subscription_count:
                    type: integer
                    format: int64
                updated_at:
                    type: string
                    format: date-time
            required:
                - account_id
                - created_at
                - environment_id
                - external_id
                - is_active
                - name
                - price
                - product_id
                - provider_type
                - quantity
                - updated_at
                - prices
                - subscription_count
            title: BillingProductDetailResponseData
        BillingProductForSubscriptionResponseData:
            type: object
            properties:
                billing_scheme:
                    $ref: '#/components/schemas/BillingPriceScheme'
                billing_threshold:
                    type: integer
                    format: int64
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                currency:
                    $ref: '#/components/schemas/Currency'
                environment_id:
                    type: string
                external_id:
                    type: string
                id:
                    type: string
                interval:
                    type: string
                interval_count:
                    type: integer
                    format: int64
                    nullable: true
                meter_id:
                    type: string
                    nullable: true
                name:
                    type: string
                package_size:
                    type: integer
                    format: int64
                price:
                    type: integer
                    format: int64
                price_decimal:
                    type: string
                    nullable: true
                price_external_id:
                    type: string
                price_id:
                    type: string
                price_tier:
                    type: array
                    items:
                        $ref: '#/components/schemas/BillingProductPriceTierResponseData'
                    maxItems: 100
                provider_type:
                    $ref: '#/components/schemas/BillingProviderType'
                quantity:
                    type: number
                    format: double
                subscription_id:
                    type: string
                subscription_item_external_id:
                    type: string
                    nullable: true
                updated_at:
                    type: string
                    format: date-time
                usage_type:
                    $ref: '#/components/schemas/BillingPriceUsageType'
            required:
                - id
                - created_at
                - currency
                - environment_id
                - external_id
                - interval
                - name
                - package_size
                - price
                - price_external_id
                - price_id
                - price_tier
                - provider_type
                - quantity
                - billing_scheme
                - subscription_id
                - updated_at
                - usage_type
            title: BillingProductForSubscriptionResponseData
        BillingProductPriceInterval:
            type: string
            enum:
                - day
                - month
                - one-time
                - year
        BillingProductPriceResponseData:
            type: object
            properties:
                billing_scheme:
                    $ref: '#/components/schemas/BillingPriceScheme'
                created_at:
                    type: string
                    format: date-time
                currency:
                    $ref: '#/components/schemas/Currency'
                id:
                    type: string
                interval:
                    $ref: '#/components/schemas/BillingProductPriceInterval'
                interval_count:
                    type: integer
                    format: int64
                is_active:
                    type: boolean
                meter_id:
                    type: string
                    nullable: true
                nickname:
                    type: string
                    nullable: true
                package_size:
                    type: integer
                    format: int64
                price:
                    type: integer
                    format: int64
                price_decimal:
                    type: string
                    nullable: true
                price_external_id:
                    type: string
                product_external_id:
                    type: string
                provider_type:
                    $ref: '#/components/schemas/BillingProviderType'
                tiers_mode:
                    allOf:
