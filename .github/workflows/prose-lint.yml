name: Prose Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-prose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MDX prose against the writing rules in CLAUDE.md
        run: python3 scripts/prose_lint.py
