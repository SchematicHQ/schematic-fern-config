name: Sync SDK READMEs

on:
  schedule:
    # Weekly on Monday at 11 AM UTC, an hour after Regenerate SDKs
    - cron: '0 11 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automated/sync-sdk-readmes
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync docs pages from SDK READMEs
        run: python3 scripts/sync_sdk_readmes.py

      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All SDK pages already match their READMEs."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # The Fern Check workflow does not run on pull requests opened with
      # GITHUB_TOKEN, so validate here instead.
      - name: Install Fern
        if: steps.drift.outputs.changed == 'true'
        run: npm install -g fern-api

      - name: Check API definition is valid
        if: steps.drift.outputs.changed == 'true'
        run: fern check

      - name: Open or update pull request
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add fern/docs/pages/developer_resources/sdks/
          git commit -m "chore(docs): sync SDK pages with their repo READMEs"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the existing pull request for $BRANCH."
          else
            gh pr create --draft \
              --head "$BRANCH" \
              --base main \
              --title "chore(docs): sync SDK pages with their repo READMEs" \
              --body "The SDK docs pages have drifted from the READMEs in their SDK repos. Regenerated by \`scripts/sync_sdk_readmes.py\`.

Review the diff against the upstream READMEs before merging: whatever landed in an SDK repo lands on the docs site."
          fi
